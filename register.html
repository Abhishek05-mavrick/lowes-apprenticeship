<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body>
    <h1>Registration Form</h1>
    <form action="./register.html" method="post">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required><br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required><br><br>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required><br><br>

        <label for="phone">Phone Number:</label>
        <input type="tel" id="phone" name="phone" required><br><br>

        <label for="joining-date">Joining Date:</label>
        <input type="date" id="joining-date" name="joining_date" required><br><br>

        <label for="Department">Department:</label>
        <input type="radio" name="department" value="HR" required> HR
        <input type="radio" name="department" value="IT" required> IT
        <input type="radio" name="department" value="Finance" required> Finance<br><br>

        <label for="gender">Gender:</label>
        <select id="gender" name="gender" required>
            <option value="male">Male</option>
            <option value="Female">Female</option>
        </select><br><br>

        <label for="skills">Skills: </label>
        <input type="checkbox" name="skills" value="HTML"> HTML
        <input type="checkbox" name="skills" value="CSS"> CSS   
        <input type="checkbox" name="skills" value="JavaScript"> JavaScript
        <input type="checkbox" name="skills" value="Python"> Python<br><br

        <label for="experience">Experience letter</label> 
        <input type="file" id="experience" name="experience" accept=".pdf,.doc,.docx" required><br><br>
        

        <label for="address">Address:</label>
        <textarea id="address" name="address" rows="4" cols="50" required></textarea><br><br>



        <input type="submit" value="Register">
        <input type="reset" value="Reset">
    </form>
</body>
</html>
